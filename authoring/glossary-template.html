<!doctype html>
<html lang="en" data-theme="tokyo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary · Zero to AI Systems</title>
<script>try{var t=localStorage.getItem("nz-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-root="." data-page="glossary">
<div class="app">
<aside id="sidebar" class="sidebar"></aside>
<div class="main-col">
<main class="content">
<article class="prose">
<header class="chapter-head">
  <h1>Glossary</h1>
  <p class="lede">592 terms from across the path, each with a one-line definition and a link to the chapter, lab or case study that explains it properly.</p>
</header>
<input id="gloss-search" class="glossary-search" type="text" placeholder="Search terms… (try &quot;TTL&quot; or &quot;quorum&quot;)" aria-label="Search the glossary" autocomplete="off">
<div class="gloss-chips" role="group" aria-label="Filter by course"><button type="button" class="pill active" data-course="">All</button><button type="button" class="pill" data-course="net">Networking from Zero</button><button type="button" class="pill" data-course="sys">How Programs Run</button><button type="button" class="pill" data-course="data">Data Systems</button><button type="button" class="pill" data-course="arch">Software Architecture &amp; Design</button><button type="button" class="pill" data-course="dist">Distributed Systems, Deep</button><button type="button" class="pill" data-course="ops">Reliability &amp; Operations</button><button type="button" class="pill" data-course="sec">Security Engineering</button><button type="button" class="pill" data-course="design">System Design Studio</button></div>
<p id="gloss-empty" class="widget-help" hidden>No matching terms.</p>
<div class="glossary-list">
</div>
</article>
</main>
</div>
</div>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  var input = document.getElementById("gloss-search");
  var empty = document.getElementById("gloss-empty");
  var course = "";
  function filter() {
    var q = input.value.trim().toLowerCase(), any = false;
    document.querySelectorAll(".gloss-group").forEach(function (g) {
      var shown = 0;
      g.querySelectorAll(".gloss").forEach(function (item) {
        var inCourse = !course || (course[0] === "@" ? (" " + (item.dataset.tracks || "") + " ").indexOf(" " + course.slice(1) + " ") !== -1 : item.dataset.course === course);
        var hit = (!q || item.dataset.text.indexOf(q) !== -1) && inCourse;
        item.hidden = !hit; if (hit) shown++;
      });
      g.hidden = shown === 0; if (shown) any = true;
    });
    empty.hidden = any;
  }
  input.addEventListener("input", filter);
  document.querySelectorAll(".gloss-chips .pill").forEach(function (b) {
    b.addEventListener("click", function () {
      course = b.dataset.course;
      document.querySelectorAll(".gloss-chips .pill").forEach(function (x) { x.classList.toggle("active", x === b); });
      filter();
    });
  });
  // glossary.html?q=term (the hover cards link here) pre-fills the search.
  var q = new URLSearchParams(location.search).get("q");
  if (q) { input.value = q; filter(); }
})();
</script>
</body>
</html>
