<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" width="64" height="64">
    <h1>It works!</h1>
    <p>This page was served by <strong>your own HTTP server</strong>, built from raw sockets.
       Your browser just made at least four requests for it: this HTML, the stylesheet,
       the logo and the script. Open DevTools, Network tab, and look at the Connection and
       Protocol columns.</p>

    <h2>Guestbook</h2>
    <form id="form">
      <input id="name" placeholder="Your name" required maxlength="40">
      <input id="message" placeholder="Say something" required maxlength="200">
      <button>Sign</button>
    </form>
    <ul id="entries"></ul>
    <p class="note" id="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
